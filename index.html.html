<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5e8e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Book">
<link rel="manifest" href="manifest.webmanifest">
<title>Our Anniversary Book</title>
<style>
:root{
 --bg:#fbf6f2;--paper:#fffdf9;--ink:#3d3231;--muted:#9b8581;--rose:#c88787;--rose2:#efd4d3;
 --cream:#f5eadf;--line:#eadbd6;--sage:#dfe7dc;--shadow:0 12px 34px rgba(82,54,51,.10)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#f8eceb 0,#fbf6f2 210px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}button{touch-action:manipulation}
.app{max-width:1180px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand h1{font:700 29px Georgia,serif;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{border:0;background:var(--rose);color:#fff;border-radius:999px;padding:11px 15px;font-weight:800;box-shadow:var(--shadow)}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px;margin-bottom:10px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#ffffffb8;border-radius:999px;padding:9px 13px;font-weight:700;font-size:13px}
.tab.active{background:var(--ink);color:white;border-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.cover{min-height:570px;display:grid;place-items:center;text-align:center;padding:30px;background:
 radial-gradient(circle at 18% 15%,#f1d4d0 0 2px,transparent 3px),
 radial-gradient(circle at 82% 30%,#e7c7c2 0 2px,transparent 3px),
 linear-gradient(135deg,#fffaf6,#f8e7e4)}
.cover-inner{max-width:560px}.heart{font-size:42px}.cover h2{font:italic 700 42px Georgia,serif;margin:12px 0 5px}.cover p{color:var(--muted);line-height:1.6}
.cover input{max-width:400px;text-align:center}
.workspace{display:grid;grid-template-columns:270px 1fr;gap:16px}
.sidebar{padding:13px}.sidehead{display:flex;justify-content:space-between;align-items:center;padding:5px 5px 12px;font-weight:800}
.page-list{display:flex;flex-direction:column;gap:8px}
.page-item{border:1px solid var(--line);background:white;border-radius:14px;padding:10px;text-align:left;display:flex;align-items:center;gap:9px}
.page-item.active{background:#fff6f4;border-color:var(--rose)}
.handle{color:#c7aaa5;font-size:18px;cursor:grab}.num{width:28px;height:28px;border-radius:9px;background:var(--rose2);display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}
.page-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.type{font-size:10px;color:var(--muted)}
.editor{padding:20px}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.editor-head small{color:var(--muted)}
.iconbtn{border:0;background:#f7ebe8;border-radius:10px;padding:8px 10px}
label{display:block;font-size:12px;font-weight:850;margin:14px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:10px 11px;outline:none}
textarea{min-height:88px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;min-height:170px;box-shadow:0 6px 15px #6e4e4710}.sheet h3{font:700 17px Georgia,serif;margin:0 0 5px}
.section{border-top:1px dashed #dbc7c1;margin-top:20px;padding-top:17px}.section h3{font:700 19px Georgia,serif;margin:0 0 4px}.hint{color:var(--muted);font-size:12px}
.upload{margin-top:11px;border:1.5px dashed #d6bbb6;background:#fff7f5;border-radius:15px;padding:14px;text-align:center}.upload input{display:none}.upload label{display:inline-block;margin:0;background:var(--rose2);padding:9px 12px;border-radius:11px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:12px}.photo{position:relative;background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.photo img{width:100%;height:145px;object-fit:cover;display:block}.photo button{position:absolute;right:6px;top:6px;border:0;background:#fffffff2;border-radius:8px;width:28px;height:28px}.caption{font-size:11px;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statuses{display:flex;gap:7px;flex-wrap:wrap}.status{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:12px}.status.on{background:var(--sage);border-color:#c7d4c2}
.checkrow,.shoprow{display:flex;gap:8px;align-items:center;margin:8px 0}.checkrow input[type=checkbox],.shoprow input[type=checkbox]{width:20px;flex:none}.checkrow input[type=text],.shoprow input[type=text]{flex:1}.tiny{border:0;background:none;color:#b37d76;font-size:18px}
.addline{border:0;background:#f4e5e1;border-radius:10px;padding:8px 11px;font-weight:750;margin-top:5px}
.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.stat b{font:700 29px Georgia,serif;display:block}.stat span{color:var(--muted);font-size:12px}
.shopping{padding:18px}.shop-card{padding:12px;border:1px solid var(--line);border-radius:14px;margin:9px 0;background:white}.shop-card strong{font-family:Georgia,serif}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty h2{color:var(--ink);font:700 26px Georgia,serif}
.modal{position:fixed;inset:0;background:#3c2f2e55;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.sheetmodal{width:min(620px,100%);background:var(--paper);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0002}.sheetmodal h2{font:700 24px Georgia,serif;margin:0 0 15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:white;border-radius:17px;padding:20px 12px;text-align:center}.choice b{display:block;font-family:Georgia,serif;margin-top:8px}.close{width:100%;border:0;background:none;margin-top:12px;padding:10px;color:var(--muted)}
.qr-card{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff9f7}.qr-grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.qr-preview{text-align:center;margin-top:12px}.qr-preview canvas{background:white;padding:10px;border-radius:14px;border:1px solid var(--line);max-width:220px;width:100%;height:auto}.qr-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}.qr-actions button{border:0;background:var(--rose2);border-radius:10px;padding:8px 10px;font-weight:750}.install{margin-top:15px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff9f6;font-size:13px;line-height:1.45}
@media(max-width:760px){.brand h1{font-size:23px}.workspace{grid-template-columns:1fr}.sidebar{order:2}.editor{order:1;padding:16px}.page-list{display:grid;grid-template-columns:1fr 1fr}.fields,.dashboard{grid-template-columns:1fr}.cover{min-height:520px}.cover h2{font-size:34px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body><div class="app">
<header><div class="brand"><h1>Our Anniversary Book ♡</h1><p>our little scrapbook planner</p></div><button class="pill" onclick="openAdd()">＋ Seite</button></header>
<nav class="tabs">
<button class="tab active" data-view="book" onclick="view('book')">📖 Buch</button>
<button class="tab" data-view="cover" onclick="view('cover')">🎀 Cover</button>
<button class="tab" data-view="shopping" onclick="view('shopping')">🛍 Einkaufsliste</button>
<button class="tab" data-view="overview" onclick="view('overview')">✓ Übersicht</button>
</nav>
<div id="main"></div></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeAdd()"><div class="sheetmodal">
<h2>Was möchtest du hinzufügen? ♡</h2><div class="choices">
<button class="choice" onclick="addPage('single')"><span style="font-size:30px">📄</span><b>Einzelseite</b><small>Eine Buchseite</small></button>
<button class="choice" onclick="addPage('double')"><span style="font-size:30px">📖</span><b>Doppelseite</b><small>Zwei zusammengehörige Seiten</small></button>
</div><button class="close" onclick="closeAdd()">Abbrechen</button></div></div>

<script>
const KEY="lilly_scrapbook_v1";
function blank(){return {coverTitle:"Our First Year",coverSub:"365 days of us ♡",pages:[],selected:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}}
let S=load(), V="book";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function current(){return S.pages.find(p=>p.id===S.selected)}
function view(v){V=v;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===v));render()}
function openAdd(){document.querySelector("#modal").classList.add("open")} function closeAdd(){document.querySelector("#modal").classList.remove("open")}
function addPage(type){let id=Date.now();S.pages.push({id,type,title:type==="double"?"Neue Doppelseite":"Neue Seite",subtitle:"",ideas:"",text:"",colors:"",materials:"",decor:"",notes:"",left:"",right:"",status:"Idee",images:[],checks:[],shopping:[],videos:[]});S.selected=id;save();closeAdd();V="book";render();setTimeout(()=>document.querySelector("#title")?.select(),50)}
function select(id){S.selected=id;save();render()}
function upd(k,v){let p=current();p[k]=v;save();if(k==="title")renderSidebar()}
function coverUpd(k,v){S[k]=v;save()}
function status(v){current().status=v;save();render()}
function delPage(){if(!confirm("Diese Seite wirklich löschen?"))return;let i=S.pages.findIndex(p=>p.id===S.selected);S.pages.splice(i,1);S.selected=S.pages[Math.max(0,i-1)]?.id||null;save();render()}
function move(id,dir){let i=S.pages.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=S.pages.length)return;[S.pages[i],S.pages[j]]=[S.pages[j],S.pages[i]];save();render()}
function addImage(files){let p=current();[...files].forEach(f=>{let r=new FileReader();r.onload=()=>{p.images.push({src:r.result,name:f.name});save();render()};r.readAsDataURL(f)})}
function rmImg(i){current().images.splice(i,1);save();render()}
function addCheck(){current().checks.push({text:"",done:false});save();render()}
function setCheck(i,k,v){current().checks[i][k]=v;save()}
function rmCheck(i){current().checks.splice(i,1);save();render()}
function addShop(){current().shopping.push({text:"",done:false});save();render()}
function setShop(i,k,v){current().shopping[i][k]=v;save()}
function rmShop(i){current().shopping.splice(i,1);save();render()}

function ensureVideos(){let p=current();if(p&&!Array.isArray(p.videos))p.videos=[]}
function addVideo(){ensureVideos();current().videos.push({title:"",url:""});save();render()}
function setVideo(i,k,v){ensureVideos();current().videos[i][k]=v;save();if(k==="url")drawQR(i)}
function rmVideo(i){ensureVideos();current().videos.splice(i,1);save();render()}
function drawQR(i){ensureVideos();let v=current()?.videos?.[i],c=document.getElementById("qr"+i);if(!v||!c||!v.url)return;try{QRCode.toCanvas(c,v.url,{width:220,margin:1,errorCorrectionLevel:"H"},()=>{})}catch(e){}}
function drawAllQR(){ensureVideos();(current()?.videos||[]).forEach((_,i)=>drawQR(i))}
function downloadQR(i){ensureVideos();let v=current().videos[i];if(!v.url){alert("Füge zuerst einen Videolink ein ♡");return}let c=document.getElementById("qr"+i);drawQR(i);setTimeout(()=>{let a=document.createElement("a");a.download=(v.title||"QR-Memory").replace(/[^a-z0-9äöüß _-]/gi,"")+".png";a.href=c.toDataURL("image/png");a.click()},100)}
function renderSidebar(){let el=document.querySelector("#plist");if(!el)return;el.innerHTML=S.pages.length?S.pages.map((p,i)=>`<button class="page-item ${p.id===S.selected?"active":""}" onclick="select(${p.id})"><span class="handle">⋮⋮</span><span class="num">${i+1}</span><span class="page-title">${esc(p.title)}<span class="type">${p.type==="double"?" · Doppelseite":""}</span></span><span onclick="event.stopPropagation();move(${p.id},-1)">↑</span><span onclick="event.stopPropagation();move(${p.id},1)">↓</span></button>`).join(""):`<div class="hint" style="padding:15px 5px">Noch keine Seiten.</div>`}
function book(){
let p=current();let editor=p?`<section class="card editor"><div class="editor-head"><small>${p.type==="double"?"Doppelseite":"Einzelseite"} · Position ${S.pages.indexOf(p)+1}</small><button class="iconbtn" onclick="delPage()">🗑</button></div>
<label>Überschrift</label><input id="title" value="${esc(p.title)}" oninput="upd('title',this.value)" placeholder="Where We First Kissed">
<label>Untertitel / Datum</label><input value="${esc(p.subtitle)}" oninput="upd('subtitle',this.value)" placeholder="z. B. the beginning of everything ♡">
${p.type==="double"?`<div class="spread"><div class="sheet"><h3>Linke Seite</h3><textarea oninput="upd('left',this.value)" placeholder="Idee für die linke Buchseite...">${esc(p.left)}</textarea></div><div class="sheet"><h3>Rechte Seite</h3><textarea oninput="upd('right',this.value)" placeholder="Idee für die rechte Buchseite...">${esc(p.right)}</textarea></div></div>`:""}
<div class="statuses"><button class="status ${p.status==="Idee"?"on":""}" onclick="status('Idee')">💭 Idee</button><button class="status ${p.status==="In Arbeit"?"on":""}" onclick="status('In Arbeit')">✂️ In Arbeit</button><button class="status ${p.status==="Fertig"?"on":""}" onclick="status('Fertig')">✓ Fertig</button></div>
<div class="fields"><div><label>Ideen</label><textarea oninput="upd('ideas',this.value)" placeholder="Aufbau, kleine Details, Gedanken...">${esc(p.ideas)}</textarea></div><div><label>Text / Erinnerung</label><textarea oninput="upd('text',this.value)" placeholder="Brief, Erinnerung, Insider, Zitat...">${esc(p.text)}</textarea></div><div><label>Farben</label><textarea oninput="upd('colors',this.value)" placeholder="Creme, Bordeaux, Rosa...">${esc(p.colors)}</textarea></div><div><label>Materialien</label><textarea oninput="upd('materials',this.value)" placeholder="Papier, Transparentpapier, Band...">${esc(p.materials)}</textarea></div><div><label>Deko / DIY</label><textarea oninput="upd('decor',this.value)" placeholder="Polaroid, Klappe, Umschlag...">${esc(p.decor)}</textarea></div><div><label>Sonstiges</label><textarea oninput="upd('notes',this.value)" placeholder="Alles andere...">${esc(p.notes)}</textarea></div></div>
<div class="section"><h3>Moodboard ♡</h3><div class="hint">Pinterest-Screenshots und Inspirationsbilder nur für diese Seite.</div><div class="upload"><input id="pics" type="file" accept="image/*" multiple onchange="addImage(this.files)"><label for="pics">📸 Bilder hinzufügen</label></div><div class="gallery">${p.images.map((x,i)=>`<div class="photo"><img src="${x.src}"><button onclick="rmImg(${i})">×</button><div class="caption">${esc(x.name)}</div></div>`).join("")}</div></div>
<div class="section"><h3>🎥 Videos & QR Memories</h3><div class="hint">Füge einen freigegebenen Videolink ein. Die App erstellt daraus automatisch einen QR-Code zum Ausdrucken.</div>${(p.videos||[]).map((v,i)=>`<div class="qr-card"><label>Titel</label><input value="${esc(v.title)}" oninput="setVideo(${i},'title',this.value)" placeholder="z. B. Me after our first date ♡"><label>Videolink</label><input value="${esc(v.url)}" oninput="setVideo(${i},'url',this.value)" placeholder="https://..."><div class="qr-preview">${v.url?`<canvas id="qr${i}"></canvas><div class="hint">scan me ♡</div><div class="qr-actions"><button onclick="downloadQR(${i})">⬇️ QR speichern</button><button onclick="rmVideo(${i})">🗑 Entfernen</button></div>`:`<div class="hint" style="padding:12px">Sobald du einen Link einfügst, erscheint hier dein QR-Code ♡</div>`}</div></div>`).join("")}<button class="addline" onclick="addVideo()">＋ Video / QR-Code</button></div>
<div class="section"><h3>Checkliste</h3>${p.checks.map((x,i)=>`<div class="checkrow"><input type="checkbox" ${x.done?"checked":""} onchange="setCheck(${i},'done',this.checked)"><input type="text" value="${esc(x.text)}" oninput="setCheck(${i},'text',this.value)" placeholder="z. B. Fotos ausdrucken"><button class="tiny" onclick="rmCheck(${i})">×</button></div>`).join("")}<button class="addline" onclick="addCheck()">＋ Aufgabe</button></div>
<div class="section"><h3>Was brauche ich für diese Seite?</h3>${p.shopping.map((x,i)=>`<div class="shoprow"><input type="checkbox" ${x.done?"checked":""} onchange="setShop(${i},'done',this.checked)"><input type="text" value="${esc(x.text)}" oninput="setShop(${i},'text',this.value)" placeholder="z. B. rotes Satinband"><button class="tiny" onclick="rmShop(${i})">×</button></div>`).join("")}<button class="addline" onclick="addShop()">＋ Material</button></div>
</section>`:`<section class="card empty"><h2>Noch ganz leer ♡</h2><p>Erstelle deine erste Einzel- oder Doppelseite.</p><button class="pill" onclick="openAdd()">＋ Erste Seite</button></section>`;
return `<div class="workspace"><aside class="card sidebar"><div class="sidehead"><span>Buchseiten</span><span>${S.pages.length}</span></div><div class="page-list" id="plist"></div></aside>${editor}</div>`}
function cover(){return `<section class="card cover"><div class="cover-inner"><div class="heart">♡</div><h2>${esc(S.coverTitle)}</h2><p>${esc(S.coverSub)}</p><label>Cover-Titel</label><input value="${esc(S.coverTitle)}" oninput="coverUpd('coverTitle',this.value);document.querySelector('.cover h2').textContent=this.value"><label>Kleine Zeile darunter</label><input value="${esc(S.coverSub)}" oninput="coverUpd('coverSub',this.value);document.querySelector('.cover p').textContent=this.value"><div class="install"><b>Als App auf dem iPhone:</b><br>Wenn diese Web-App online gehostet ist, in Safari öffnen → Teilen → „Zum Home-Bildschirm“. Dann öffnet sie sich wie eine eigene App.</div></div></section>`}
function shopping(){let any=S.pages.some(p=>p.shopping.length);return `<section class="card shopping"><h2 style="font-family:Georgia,serif">Einkaufsliste 🛍</h2><p class="hint">Alles aus deinen einzelnen Seiten gesammelt – mit Zuordnung, wofür du es brauchst.</p>${any?S.pages.filter(p=>p.shopping.length).map(p=>`<div class="shop-card"><strong>${esc(p.title)}</strong>${p.shopping.map((x,i)=>`<div class="shoprow"><input type="checkbox" ${x.done?"checked":""} onchange="let p=S.pages.find(q=>q.id===${p.id});p.shopping[${i}].done=this.checked;save()"><span style="${x.done?"text-decoration:line-through;color:#9b8581":""}">${esc(x.text||"Unbenanntes Material")}</span></div>`).join("")}</div>`).join(""):`<div class="empty">Noch nichts auf der Einkaufsliste. Füge Materialien direkt bei einer Buchseite hinzu.</div>`}</section>`}
function overview(){let done=S.pages.filter(p=>p.status==="Fertig").length,work=S.pages.filter(p=>p.status==="In Arbeit").length,imgs=S.pages.reduce((a,p)=>a+p.images.length,0);return `<div class="dashboard"><div class="card stat"><b>${S.pages.length}</b><span>Seiten / Doppelseiten geplant</span></div><div class="card stat"><b>${done}</b><span>fertig</span></div><div class="card stat"><b>${imgs}</b><span>Inspo-Bilder gesammelt</span></div></div><section class="card shopping" style="margin-top:12px"><h2 style="font-family:Georgia,serif">Fortschritt ♡</h2>${S.pages.map((p,i)=>`<div class="shop-card"><strong>${i+1}. ${esc(p.title)}</strong><div class="hint">${p.type==="double"?"Doppelseite":"Einzelseite"} · ${p.status}</div></div>`).join("")||'<div class="empty">Noch keine Seiten geplant.</div>'}</section>`}
function render(){let m=document.querySelector("#main");m.innerHTML=V==="book"?book():V==="cover"?cover():V==="shopping"?shopping():overview();if(V==="book"){renderSidebar();setTimeout(drawAllQR,0)}}
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
